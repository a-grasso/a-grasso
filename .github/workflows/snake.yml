name: Contribution snake

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1f6f5c&color_dots=#ebe9e4,#b9d8cd,#7fb8a5,#3f9179,#1f6f5c
            dist/snake-dark.svg?color_snake=#58c4a5&color_dots=#1c1f22,#1d4a3e,#2a6e5b,#3f9a80,#58c4a5
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
